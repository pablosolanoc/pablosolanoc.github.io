name: Deploy to GitHub Pages

on:
  push:
    branches: "main"

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If you're using pnpm, add this step then change the commands and cache key below to use `pnpm`
      # - name: Install pnpm
      #   uses: pnpm/action-setup@v3
      #   with:
      #     version: 8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # Fail loudly: a missing ID no longer breaks the build, so without this
      # guard we would silently deploy a site with no analytics.
      - name: Check Google Analytics ID
        env:
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: |
          if [ -z "$VITE_GA_ID" ]; then
            echo "::error::VITE_GA_ID is empty. Set the VITE_GA_ID repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if ! echo "$VITE_GA_ID" | grep -qE '^G-[A-Z0-9]+$'; then
            echo "::error::VITE_GA_ID does not look like a GA4 measurement ID (expected G-XXXXXXXXXX)."
            exit 1
          fi
          echo "Google Analytics ID looks valid."

      - name: build
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build/"

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
